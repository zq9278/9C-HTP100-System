name: Native regression
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/test.py
      - run: node --test tools/pressure_tuner/main.test.cjs
      - run: python tools/pressure_tuner/test_bridge.py
      - run: python tests/test_ihex.py
      - run: node --test tools/firmware_flasher/backend.test.cjs
