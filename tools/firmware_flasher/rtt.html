<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>RTT 调试</title><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>RTT 参数与日志</h1><p>仅支持主机 Tuning 固件。参数临时生效，不写入 Flash / EEPROM；断开约2秒后恢复默认。</p></header><main>
<section><div class="row"><button id="back">返回烧录</button><button id="tuning">烧录主机调试固件</button><button id="connect">连接 RTT</button><button id="disconnect" disabled>恢复默认并断开</button><span id="state" role="status">未连接</span></div><p>探针序列号和速度沿用烧录页设置。调试结束后，可返回烧录页恢复 CE 正式固件。</p></section>
<section><div class="row"><label>挡位 <select id="profile"><option value="0">150</option><option value="1">250</option><option value="2">350</option><option value="3">450</option><option value="4">550</option></select></label><button id="read" disabled>读取参数</button></div>
<div class="row"><label>前进速度上限<input id="fast" type="number" min="1" max="65535"></label><label>回退速度上限<input id="retract" type="number" min="1" max="65535"></label><label>Kp<input id="kp" type="number" min="0.01" max="1000" step="any"></label><label>减速比例<input id="ratio" type="number" min="0.01" max="1" step="0.01"></label><button id="write" disabled>应用临时参数</button></div><p id="result" role="status"></p></section>
<section><div class="row"><h2>实时日志</h2><button id="pause">暂停显示</button><button id="clear">清空</button></div><pre id="rtt-log" aria-live="off"></pre></section></main><script src="rtt-ui.js"></script></body></html>
