<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>压力调参</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>body{font:16px system-ui;background:#101827;color:#e2e8f0;margin:30px}button,input,select{font:inherit;padding:10px;margin:5px}input{width:130px}label{display:inline-block}pre{white-space:pre-wrap}</style>
<h2>J-Link RTT 压力实时调参</h2><button id="flash">编译并烧录调试固件</button><button id="connect">连接 J-Link</button><button id="disconnect" disabled>恢复默认并断开</button><p id="status"></p>
<select id="profile"><option value="0">150档</option><option value="1" selected>250档</option><option value="2">350档</option><option value="3">450档</option><option value="4">550档</option></select><button id="read" disabled>读取参数</button>
<div><label>前进速度上限<input id="fast" type="number" min="1" max="65535"></label><label>回退速度上限<input id="retract" type="number" min="1" max="65535"></label><label>Kp<input id="kp" type="number" min="0.01" max="1000"></label><label>减速比例<input id="ratio" type="number" min="0.01" max="1" step="0.01"></label></div>
<button id="write" disabled>应用参数</button><p>参数临时生效，不保存。正常断开立即恢复；通信中断后固件在 2 秒租约到期后恢复默认值。</p><pre id="log"></pre><script src="renderer.js"></script></html>
